services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food_delivery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_delivery"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
